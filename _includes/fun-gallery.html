<!-- image gallery -->
<div class="fun-frame">
  <img id="fun-random-img" alt="Something fun">
  <div id="fun-caption" class="fun-caption"></div>
</div>

<div id="fun-lightbox" class="fun-lightbox" hidden>
  <div class="fun-lightbox__backdrop" id="fun-lightbox-nav"></div>
  <figure class="fun-lightbox__content" role="dialog" aria-modal="true" aria-label="Fun photo">
    <img id="fun-lightbox-img" alt="">
  </figure>
</div>


<script>
  const funImages = [
    /* { src: "/images/annunciation.webp", caption: "Da Vinci, L. (1476). Annunciazione. [refresh for more art]" },
    { src: "/images/horsemen.webp", caption: "Dürer, A. (1498). Die vier apokalyptischen Reiter. [refresh for more art]" },
    { src: "/images/ritter.webp", caption: "Dürer, A. (1513). Ritter, Tod und Teufel. [refresh for more art]" },
    { src: "/images/monk.webp", caption: "Friedrich, C. D. (1810). Der Mönch am Meer. [refresh for more art]" },
    { src: "/images/bookworm.webp", caption: "Spitzweg, C. (1850). Der Bücherwurm. [refresh for more art]" },
    { src: "/images/don.webp", caption: "Doré, G. (1863). Don Quichotte dans sa bibliothèque. [refresh for more art]" },
    { src: "/images/empyrean.webp", caption: "Doré, G. (1868). Empyrean. [refresh for more art]" },
    { src: "/images/isle.webp", caption: "Böcklin, A. (1883). Die Toteninsel (3rd Version). [refresh for more art]" },
    { src: "/images/grosz.webp", caption: "Grosz, G. (1920). Republikanische Automaten. [refresh for more art]" },
    { src: "/images/ntbr.webp", caption: "Magritte, R. (1937). La reproduction interdite. [refresh for more art]" }, */
    { src: "/images/escher.webp", caption: "Escher, M. C. (1953). Relativity [ghiblified]." },
  ];

  const pick = funImages[Math.floor(Math.random() * funImages.length)];
  const img = document.getElementById("fun-random-img");
  const cap = document.getElementById("fun-caption");

  img.src = pick.src;
  cap.textContent = pick.caption || ""; 

  (function () {
    const sourceImg = document.getElementById("fun-random-img");
    const lb = document.getElementById("fun-lightbox");
    const lbImg = document.getElementById("fun-lightbox-img");
    if (!sourceImg || !lb || !lbImg) return;

    function openLightbox() {
      lbImg.src = sourceImg.currentSrc || sourceImg.src;
      lbImg.alt = sourceImg.alt || "Fun photo";
      lb.hidden = false;
      document.documentElement.classList.add("fun-lightbox-open");
    }

    function closeLightbox() {
      lb.hidden = true;
      document.documentElement.classList.remove("fun-lightbox-open");
      lbImg.src = "";
    }

    sourceImg.style.cursor = "zoom-in";
    sourceImg.addEventListener("click", openLightbox);
    lb.addEventListener("click", () => closeLightbox());
    document.addEventListener("keydown", (e) => {
      if (!lb.hidden && e.key === "Escape") closeLightbox();
    });
  })();
</script>

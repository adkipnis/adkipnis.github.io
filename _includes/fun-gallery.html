<!-- image gallery -->
<div class="fun-frame">
  <img id="fun-random-img" alt="Something fun">
  <div id="fun-caption" class="fun-caption"></div>
</div>

<div id="fun-lightbox" class="fun-lightbox" hidden>
  <div class="fun-lightbox__backdrop" id="fun-lightbox-nav"></div>
  <figure class="fun-lightbox__content" role="dialog" aria-modal="true" aria-label="Fun photo">
    <img id="fun-lightbox-img" alt="">
  </figure>
</div>


<script>
  const funImages = [
    /* { src: "/images/chart.webp", caption: "Some of the music I hold dearly (in no particular order)." }, */
    { src: "/images/annunciation.webp", caption: "Da Vinci, L. (1476). Annunciazione." },
    { src: "/images/horsemen.webp", caption: "Dürer, A. (1498). Die vier apokalyptischen Reiter." },
    { src: "/images/ritter.webp", caption: "Dürer, A. (1513). Ritter, Tod und Teufel." },
    { src: "/images/monk.webp", caption: "Friedrich, C. D. (1810). Der Mönch am Meer." },
    { src: "/images/don.webp", caption: "Doré, G. (1863). Don Quichotte dans sa bibliothèque." },
    { src: "/images/isle.webp", caption: "Böcklin, A. (1883). Die Toteninsel (3rd Version)." },
    { src: "/images/ntbr.webp", caption: "Magritte, R. (1937). La reproduction interdite." },
    { src: "/images/escher.webp", caption: "Escher, M. C. (1953). Relativity." },
  ];

  const pick = funImages[Math.floor(Math.random() * funImages.length)];
  const img = document.getElementById("fun-random-img");
  const cap = document.getElementById("fun-caption");

  img.src = pick.src;
  cap.textContent = pick.caption || ""; 

  (function () {
    const sourceImg = document.getElementById("fun-random-img");
    const lb = document.getElementById("fun-lightbox");
    const lbImg = document.getElementById("fun-lightbox-img");
    const chartLink = document.getElementById("open-chart-lightbox");

    if (!lb || !lbImg) return;

    function openLightboxWithSrc(src, alt) {
      lbImg.src = src;
      lbImg.alt = alt || "Image";
      lb.hidden = false;
      document.documentElement.classList.add("fun-lightbox-open");
    }

    function openLightboxFromFrame() {
      if (!sourceImg) return;
      openLightboxWithSrc(sourceImg.currentSrc || sourceImg.src, sourceImg.alt || "Fun photo");
    }

    function closeLightbox() {
      lb.hidden = true;
      document.documentElement.classList.remove("fun-lightbox-open");
      lbImg.src = "";
    }

    if (sourceImg) {
      sourceImg.style.cursor = "zoom-in";
      sourceImg.addEventListener("click", openLightboxFromFrame);
    }

    if (chartLink) {
      chartLink.addEventListener("click", (e) => {
        e.preventDefault();
        openLightboxWithSrc("/images/chart.png", "Music chart");
      });
    }

    lb.addEventListener("click", () => closeLightbox());

    document.addEventListener("keydown", (e) => {
      if (!lb.hidden && e.key === "Escape") closeLightbox();
    });
  })();
</script>
